<html lang="en">
<head>

    <title>lab4_1</title>
    <style>
        h1{
            font-family: Helvetica, sans-serif;
            color:black;

        .name {
            font-family: Helvetica;
            color: Firebrick;
            font-weight: 900;

        .age {
            font-family: Helvetica;

        }
    </style>
    <script>
        let name=window.prompt("please input your name");
        let birthyear=window.prompt("please input your birth year");
        let age=2025-parseInt(birthyear)
        document.writeln("<h1>Hello, <span class='name'>"+name+"</span>!</h1>");
        console.log("Hello,", name,"!");

        if(age>1){
            document.writeln("<h1>You are <span class='age'>"+age+" </span> years old!</h1>");
            console.log("you are", age,"years old!");
        }else if(age==1){
            document.writeln("<h1>You are <span class='age'> one </span> year old!</h1>");
            console.log("you are one year old!");
        }else{
            document.writeln("<h1>You age is a mystery!</h1>");
            console.log("your input is incorrect!");
        }
        
        
        

    </script>
